name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a newer push to the same ref supersedes a running check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The exporters hand a patch from their backup job to their commit job through
  # these artifact actions: the same hand-off between two jobs, with the same
  # pins, so a bump that breaks it fails here rather than in the exporters.
  handoff-pack:
    name: artifact hand-off (pack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Pack a change
        run: |
          printf '# hand-off probe\n' >test11.gno.land/README.md
          bash .github/scripts/backup-patch.sh pack test11.gno.land "$RUNNER_TEMP/backup.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-probe
          path: ${{ runner.temp }}/backup.patch
          if-no-files-found: error
          retention-days: 1

  handoff-apply:
    name: artifact hand-off (apply)
    needs: handoff-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handoff-probe
          path: ${{ runner.temp }}/artifact

      - name: Apply it
        run: |
          bash .github/scripts/backup-patch.sh apply test11.gno.land "$RUNNER_TEMP/artifact/backup.patch"
          [ "$(cat test11.gno.land/README.md)" = '# hand-off probe' ]

  build:
    name: build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: |
            extractor/go.sum

      - name: go mod tidy check (extractor)
        working-directory: extractor
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: build extractor
        working-directory: extractor
        run: |
          go build ./...
          go build -tags deps ./...

      - name: extractor help runs
        working-directory: extractor
        run: go run . -h 2>&1 | tee /tmp/help.out
      - name: extractor help looks sane
        run: grep -q -- '-output-dir' /tmp/help.out

      - name: clone + build tx-archive (monorepo path)
        run: |
          git clone --depth=1 https://github.com/gnolang/gno.git /tmp/gno
          cd /tmp/gno/contribs/tx-archive
          go build ./...

      - name: tx-archive backup help runs
        run: |
          cd /tmp/gno/contribs/tx-archive
          go run ./cmd backup -help 2>&1 | tee /tmp/backup-help.out
      - name: tx-archive help looks sane
        run: grep -q -- '-remote' /tmp/backup-help.out

      - name: tx-archive restore help runs
        run: |
          cd /tmp/gno/contribs/tx-archive
          go run ./cmd restore -help 2>&1 | tee /tmp/restore-help.out
      - name: restore help looks sane
        run: grep -q -- '-input-path' /tmp/restore-help.out

      # The exporters' patch from their export job to their commit job holds only
      # the files a run writes.
      - name: exporter backup patch
        run: bash tests/backup-patch.sh

      # Exercise `make fetch` (via a chain Makefile that includes rules.mk)
      # to the extent possible without a live RPC: we only invoke the
      # tx-archive-ensure target, which clones gno. That validates the
      # rules.mk plumbing is intact.
      - name: rules.mk tx-archive-ensure works
        working-directory: test11.gno.land
        run: make tx-archive-ensure

      # The fetch guard, against a file:// /status fixture: no network needed.
      - name: rules.mk check-chain-id guard
        run: |
          bash tests/chain-id-guard.sh mainnet.gno.land gnoland-1
          bash tests/chain-id-guard.sh onyx.gno.land onyx-1

      # stats on scratch chain dirs: deploys of both key casings and plain std.Tx
      # lines, calls only, every faucet transfer, a backup written earlier in the
      # same make run; non-tx files excluded; a corrupt line or no matching file
      # fails it.
      - name: rules.mk stats
        run: bash tests/stats.sh

      # fetch-all fetches chunk by chunk and stops at the first failed one (a
      # stub's, or one the guard refuses), and fails before any fetch on an
      # input that is not a number.
      - name: rules.mk fetch-all
        run: bash tests/fetch-all.sh
