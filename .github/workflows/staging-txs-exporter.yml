name: Backup Staging (formerly Portal Loop)

on:
  # allow to run workflow manually
  workflow_dispatch: { }

  # Triggers the workflow once per day at 6PM UTC
  schedule:
    - cron: "0 18 * * *"

jobs:
  backup:
    name: "backup ${{ matrix.testnet }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360 # very high; but it can take a while.

    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        testnet:
          - staging.gno.land

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22.x"

      - name: Run backup script
        run: |
          cd staging.gno.land
          bash export.sh

      - name: Run stats script
        run: make -C ${{ matrix.testnet }} stats-legacy

      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: update ${{ matrix.testnet }} backup"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
